name: Build Next.js App

on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Use your preferred Node version
          cache: "npm" # or 'npm' depending on your package manager

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
